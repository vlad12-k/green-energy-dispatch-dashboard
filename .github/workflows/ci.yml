name: CI and security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ged_test
          POSTGRES_USER: ged_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ged_test -d ged_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ged_test:ci-only-password@localhost:5432/ged_test
      TEST_DATABASE_URL: postgresql+psycopg://ged_test:ci-only-password@localhost:5432/ged_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt pip-audit
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pip_audit -r requirements-dev.txt --strict
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: green-energy-dispatch-dashboard:ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Smoke-test the built simulation-only container
        shell: bash
        run: |
          set -euo pipefail
          container_name="ged-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm --force "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container_name" \
            --memory 512m \
            --memory-swap 512m \
            --cpus 0.1 \
            --publish 127.0.0.1:18000:10000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env APP_ENV=production \
            --env DEBUG=false \
            --env HOST=0.0.0.0 \
            --env PORT=10000 \
            --env SIMULATION_ONLY_MODE=true \
            --env SERVE_FRONTEND=true \
            --env MAX_REQUEST_BODY_BYTES=65536 \
            --env API_RATE_LIMIT_REQUESTS_PER_MINUTE=60 \
            --env COLLECTOR_ENABLED=false \
            green-energy-dispatch-dashboard:ci
          python scripts/smoke_staging.py --base-url http://127.0.0.1:18000
      # Report all HIGH/CRITICAL base and application findings; gate fixed ones below.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: green-energy-dispatch-dashboard:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: green-energy-dispatch-dashboard:ci
          format: table
          ignore-unfixed: true
          exit-code: "1"
          severity: CRITICAL,HIGH
