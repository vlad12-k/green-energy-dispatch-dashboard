name: CI and security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ged_test
          POSTGRES_USER: ged_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ged_test -d ged_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ged_test:ci-only-password@localhost:5432/ged_test
      TEST_DATABASE_URL: postgresql+psycopg://ged_test:ci-only-password@localhost:5432/ged_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt pip-audit
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pip_audit -r requirements-dev.txt --strict
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: green-energy-dispatch-dashboard:ci
      # Report all HIGH/CRITICAL base and application findings; gate fixed ones below.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: green-energy-dispatch-dashboard:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: green-energy-dispatch-dashboard:ci
          format: table
          ignore-unfixed: true
          exit-code: "1"
          severity: CRITICAL,HIGH
