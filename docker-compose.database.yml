services:
  db:
    image: postgres:17-alpine
    profiles: ["database"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ged}
      POSTGRES_USER: ${POSTGRES_USER:-ged}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before enabling the database profile}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m

volumes:
  postgres_data:
